<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Open in Obsidian</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 90vh; margin: 0;
         background: #1e1e1e; color: #ddd; text-align: center; padding: 16px; }
  a.btn { display: inline-block; margin-top: 20px; padding: 14px 28px; border-radius: 10px;
          background: #7c3aed; color: #fff; text-decoration: none; font-size: 18px; font-weight: 600; }
  .path { margin-top: 12px; font-size: 13px; color: #999; word-break: break-all; }
</style>
</head>
<body>
  <div>Obsidian을 여는 중...</div>
  <a id="open" class="btn" href="#">Obsidian에서 열기</a>
  <div id="path" class="path"></div>
<script>
  // Query params: v = vault name (default 10_memo), f = file path inside the vault
  var p = new URLSearchParams(location.search);
  var vault = p.get("v") || "10_memo";
  var file = p.get("f") || "";
  var url = "obsidian://open?vault=" + encodeURIComponent(vault);
  if (file) url += "&file=" + encodeURIComponent(file);
  document.getElementById("open").href = url;
  document.getElementById("path").textContent = vault + " / " + file;
  // Auto redirect (some in-app browsers block this; the button is the fallback)
  location.href = url;
</script>
</body>
</html>
